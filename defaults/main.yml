---
# Project source code URL: https://github.com/Jackett/Jackett

jackett_enabled: true

jackett_identifier: jackett
jackett_base_path: "/{{ jackett_identifier }}"
jackett_data_path: "{{ jackett_base_path }}/data"

# renovate: datasource=docker depName=ghcr.io/linuxserver/jackett versioning=semver
jackett_version: 0.24.2644
jackett_arch: amd64

jackett_uid: ""
jackett_gid: ""

# The hostname at which Jackett is served.
jackett_hostname: ""

# The path at which Jackett is served.
# This value must either be `/` or not end with a slash (e.g. `/jackett`).
jackett_path_prefix: /

jackett_container_image: "{{ jackett_container_image_registry_prefix }}linuxserver/jackett:{{ jackett_container_image_tag }}"
jackett_container_image_tag: "{{ jackett_version }}"
jackett_container_image_registry_prefix: "{{ jackett_container_image_registry_prefix_upstream }}"
jackett_container_image_registry_prefix_upstream: "{{ jackett_container_image_registry_prefix_upstream_default }}"
jackett_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
jackett_container_network: "{{ jackett_identifier }}"

# Control if the container network is deleted on uninstalling.
jackett_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `jackett_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
jackett_container_http_host_bind_port: ""

# A port number in the container
jackett_container_http_port: 9117

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
jackett_container_additional_networks: "{{ (jackett_container_additional_networks_default + jackett_container_additional_networks_auto + jackett_container_additional_networks_custom) | unique }}"
jackett_container_additional_networks_default: []
jackett_container_additional_networks_auto: []
jackett_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
jackett_container_additional_volumes: "{{ jackett_container_additional_volumes_auto + jackett_container_additional_volumes_custom }}"
jackett_container_additional_volumes_auto: []
jackett_container_additional_volumes_custom: []

# jackett_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `jackett_container_labels_additional_labels_custom`.
jackett_container_labels_traefik_enabled: true
jackett_container_labels_traefik_docker_network: "{{ jackett_container_network }}"
jackett_container_labels_traefik_hostname: "{{ jackett_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/jackett`).
jackett_container_labels_traefik_path_prefix: "{{ jackett_path_prefix }}"
jackett_container_labels_traefik_rule: "Host(`{{ jackett_container_labels_traefik_hostname }}`){% if jackett_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ jackett_container_labels_traefik_path_prefix }}`){% endif %}"
jackett_container_labels_traefik_priority: 0
jackett_container_labels_traefik_entrypoints: web-secure
jackett_container_labels_traefik_tls: "{{ jackett_container_labels_traefik_entrypoints != 'web' }}"
jackett_container_labels_traefik_tls_certResolver: default  # noqa var-naming
jackett_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
jackett_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `jackett_container_labels_traefik_additional_request_headers_custom`
jackett_container_labels_traefik_additional_request_headers: "{{ jackett_container_labels_traefik_additional_request_headers_auto | combine(jackett_container_labels_traefik_additional_request_headers_custom) }}"
jackett_container_labels_traefik_additional_request_headers_auto: {}
jackett_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `jackett_container_labels_traefik_additional_response_headers_custom`
jackett_container_labels_traefik_additional_response_headers: "{{ jackett_container_labels_traefik_additional_response_headers_auto | combine(jackett_container_labels_traefik_additional_response_headers_custom) }}"
jackett_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': jackett_http_header_xss_protection} if jackett_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': jackett_http_header_content_type_options} if jackett_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': jackett_http_header_content_security_policy} if jackett_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': jackett_http_header_permissions_policy} if jackett_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': jackett_http_header_strict_transport_security} if jackett_http_header_strict_transport_security and jackett_container_labels_traefik_tls else {})
  }}
jackett_container_labels_traefik_additional_response_headers_custom: {}

# jackett_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `jackett_container_labels_additional_labels_custom`
#
# Example:
# jackett_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
jackett_container_labels_additional_labels: "{{ jackett_container_labels_additional_labels_auto + jackett_container_labels_additional_labels_custom }}"
jackett_container_labels_additional_labels_auto: []
jackett_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
jackett_container_extra_arguments: "{{ jackett_container_extra_arguments_auto + jackett_container_extra_arguments_custom }}"
jackett_container_extra_arguments_auto: []
jackett_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
jackett_process_extra_arguments: "{{ jackett_process_extra_arguments_auto + jackett_process_extra_arguments_custom }}"
jackett_process_extra_arguments_auto: []
jackett_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
jackett_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
jackett_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
jackett_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
jackett_http_header_permissions_policy: "{{ 'interest-cohort=()' if jackett_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
jackett_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if jackett_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `jackett_http_header_permissions_policy`
jackett_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `jackett_http_header_strict_transport_security`
jackett_hsts_preload_enabled: false

# List of systemd services that the Jackett systemd service depends on
jackett_systemd_required_services_list: "{{ (jackett_systemd_required_services_list_default + jackett_systemd_required_services_list_auto + jackett_systemd_required_services_list_custom) | unique }}"
jackett_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
jackett_systemd_required_services_list_auto: []
jackett_systemd_required_services_list_custom: []

# List of systemd services that the Jackett systemd service wants
jackett_systemd_wanted_services_list: "{{ (jackett_systemd_wanted_services_list_default + jackett_systemd_wanted_services_list_auto + jackett_systemd_wanted_services_list_custom) | unique }}"
jackett_systemd_wanted_services_list_default: []
jackett_systemd_wanted_services_list_auto: []
jackett_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
jackett_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
jackett_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
jackett_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
jackett_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ jackett_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ jackett_container_stop_grace_time_seconds }} {{ jackett_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ jackett_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ jackett_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ jackett_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ jackett_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ jackett_identifier }} after {{ jackett_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
jackett_environment_variables_tz: "Etc/UTC"

# jackett_environment_variables_additional_variables contains a multiline string with additional environment variables to pass to the container.
#
# Example:
# jackett_environment_variables_additional_variables: |
#   VAR=1
#   ANOTHER=value
jackett_environment_variables_additional_variables: ""

# jackett_restart_necessary controls whether the Jackett systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
jackett_restart_necessary: false
